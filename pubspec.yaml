name: devcv
description: Developer Profile & Resume Builder.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  flutter_riverpod: ^3.4.3
  provider: ^6.1.5+1
  get_it: ^9.3.0
  dio: ^5.11.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.6
  go_router: ^18.0.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  firebase_crashlytics: ^5.4.0
  image_picker: ^1.2.4
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
